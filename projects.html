<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e3f2fd, #f5f5f5);
    margin: 0;
    padding: 20px;
}

/* Title Section */
.title {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
}

h1 {
    color: white;
    font-size: 2.5rem;
    background: #0d4baa;
    border-radius: 10px;
    padding: 10px 20px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

/* Container to align cards */
.container {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
}

/* Card Styling */
.card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    width: 250px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    text-align: center;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 12px 20px rgba(0,0,0,0.25);
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-bottom: 3px solid #0d4baa;
}

.card h2 {
    margin: 10px 0 5px 0;
    font-size: 1.2rem;
    color: #0d4baa;
}

.card h3 {
    margin: 0 0 15px 0;
    font-size: 1rem;
    color: #555;
}

</style>

<body>
    <div class="title">
        <h1>My Projects</h1>
    </div>
    <hr>
    <div class="container">
        <div class="card">
            <a href="https://josephgh2000.github.io/cana-cuisine-restaurent/"><img
                src="./images/Flux_Dev_A_cinematic_portrait_photograph_of_Create_a_modern_lo_1.jpg" alt="restaurent" />
        </a>
        <h2>Cana Cuisine Website</h2>
        <h3>2025</h3>

        </div>
        

    </div>
</body>

</html>
